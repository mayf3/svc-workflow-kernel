name: 🛡️ Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan-credentials:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for hardcoded secrets in diff
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            DIFF_SCOPE="$BASE_SHA..$HEAD_SHA"
          else
            DIFF_SCOPE="HEAD~1..HEAD"
          fi

          VIOLATIONS=0

          # Build patterns
          PATTERNS=(
            'JWT_SECRET[[:space:]]*[=:][[:space:]]*['"'"'"]?[a-fA-F0-9]{32,}'
            'password[[:space:]]*[=:][[:space:]]*['"'"'"]?(?!<CHANGE_ME|\$|\{)([A-Za-z0-9_!@#$%^&*]{16,})'
            'postgresql?://[a-zA-Z_]+:[^@<{ ]{4,}@'
            'secret[[:space:]]*[=:][[:space:]]*['"'"'"]?(?!<CHANGE_ME|\$|\{)[A-Za-z0-9_!@#$%^&*]{20,}'
          )

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git diff "$DIFF_SCOPE" -G "$pattern" -- ':(exclude)*.md' ':(exclude).env.example' ':(exclude)*test*' ':(exclude)*test*/*.rs' ':(exclude)docs/*' --diff-filter=AM 2>/dev/null | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ 可能的硬编码密钥（pattern: $pattern）"
              echo "$MATCHES"
              VIOLATIONS=$((VIOLATIONS+1))
            fi
          done

          # 额外规则：禁止 docker-compose 中使用非环境变量的明文密码
          DC_MATCHES=$(git diff "$DIFF_SCOPE" -- 'docker-compose*.yml' 'docker-compose*.yaml' 2>/dev/null | grep -E 'POSTGRES_PASSWORD|MYSQL_PASSWORD|REDIS_PASSWORD' | grep -v '\$\{' || true)
          if [ -n "$DC_MATCHES" ]; then
            echo "❌ docker-compose 中存在硬编码密码（应使用 \${VAR} 引用环境变量）"
            echo "$DC_MATCHES"
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "🚨 发现 $VIOLATIONS 个安全违规项。请使用环境变量引用或 <CHANGE_ME> 占位符。"
            exit 1
          fi

          echo "✅ 未发现硬编码密钥"
