[package]
name = "svc-workflow"
version = "0.1.0"
edition = "2021"
description = "Serial governed workflow kernel (Rust + PostgreSQL)."
license = "MIT"

[[bin]]
name = "svc-workflow"
path = "src/main.rs"

[lib]
name = "svc_workflow"
path = "src/lib.rs"

[dependencies]
# PostgreSQL
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }

# Async runtime
tokio = { version = "1", features = ["full", "rt", "macros"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JSON Schema validation
jsonschema = "0.47"

# JSON Canonicalization Scheme (RFC 8785)
jcs-canonicalize = "0.2"

# Config
dotenvy = "0.15"

# Internal HTTP API
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.6", features = [
    "limit",
    "request-id",
    "trace",
] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }
rand = "0.8"

[profile.dev]
opt-level = 0
